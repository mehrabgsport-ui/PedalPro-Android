name: Native RC QA

on:
  push:
    branches: [ native/android-2.0.0, native/web-parity ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure licensed Neshan Native Map (if authorized)
        env:
          NESHAN_ANDROID_LICENCE_BASE64: ${{ secrets.NESHAN_ANDROID_LICENCE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NESHAN_ANDROID_LICENCE_BASE64:-}" ]; then
            mkdir -p app/src/main/res/raw
            printf '%s' "$NESHAN_ANDROID_LICENCE_BASE64" | base64 --decode > app/src/main/res/raw/neshan.licence
            test -s app/src/main/res/raw/neshan.licence
            echo "PEDALPRO_NESHAN_SDK=true" >> "$GITHUB_ENV"
            echo "Licensed Neshan SDK build selected."
          else
            echo "PEDALPRO_NESHAN_SDK=false" >> "$GITHUB_ENV"
            echo "::warning::NESHAN_ANDROID_LICENCE_BASE64 unavailable; this APK uses clearly labelled XYZ fallback, NOT Neshan."
          fi

      - name: Source architecture checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:name=".nativeapp.NativeMainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode 52' app/build.gradle
          grep -q "versionName '2.0.0-native-rc8'" app/build.gradle
          ! grep -q 'new WebView' app/src/main/java/ir/pedalpro/app/nativeapp/NativeMainActivity.java
          ! grep -q 'WeatherUiModel' app/src/main/java/ir/pedalpro/app/nativeapp/NativeMainActivity.java
          test -f app/src/main/java/ir/pedalpro/app/nativeapp/LowPowerRideActivity.java
          test -f app/src/main/java/ir/pedalpro/app/nativeapp/PedalIconView.java
          test -f app/src/main/java/ir/pedalpro/app/nativeapp/WeatherClient.java
          test -f app/src/main/java/ir/pedalpro/app/nativeapp/JalaliDate.java

      - name: Phase 5 UI state contracts
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="app/src/main/java/ir/pedalpro/app/nativeapp"
          grep -Fq 'EXTRA_IS_PAUSED' "$NATIVE/LowPowerRideActivity.java"
          grep -Fq 'EXTRA_RESULT_SECONDS' "$NATIVE/LowPowerRideActivity.java"
          grep -Fq 'paused?PedalIconView.Icon.PLAY:PedalIconView.Icon.PAUSE' "$NATIVE/LowPowerRideActivity.java"
          grep -Fq 'EXTRA_BASE_SECONDS, displayedRideSeconds()' "$NATIVE/NativeMainActivity.java"
          grep -Fq 'if(requestCode==REQ_LOW_POWER)' "$NATIVE/NativeMainActivity.java"
          grep -Fq 'rideBaseSeconds = Math.max(serverSeconds, locallyDisplayed)' "$NATIVE/NativeMainActivity.java"
          grep -Fq 'PedalIconView.Icon.HEADING' "$NATIVE/NativeLiveNavigationActivity.java"
          grep -Fq 'case HEADING:' "$NATIVE/PedalIconView.java"
          grep -Fq 'PedalIconView.Icon.SENSOR' "$NATIVE/NativeMainActivity.java"
          grep -Fq 'create.setEnabled(false)' "$NATIVE/NativeSafetyActivity.java"

      - name: Native web-parity contract audit
        shell: bash
        run: bash ci/native_web_parity_checks.sh

      - name: Unit tests
        run: |
          gradle             :app:testBazaarReleaseUnitTest             :app:testMyketReleaseUnitTest             -PpedalproNeshanAndroidSdk="$PEDALPRO_NESHAN_SDK" --stacktrace

      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          gradle             :app:lintBazaarRelease             :app:lintMyketRelease             -PpedalproNeshanAndroidSdk="$PEDALPRO_NESHAN_SDK" --stacktrace

      - name: Dump lint report
        if: always()
        shell: bash
        run: |
          set +e
          find app/build -type f -name 'lint-results-*.txt' -print | while read -r f
          do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Unsigned release smoke build
        run: |
          gradle             :app:assembleBazaarRelease             :app:assembleMyketRelease             -PpedalproNeshanAndroidSdk="$PEDALPRO_NESHAN_SDK" --stacktrace

      # Compile the optional licensed Java bridge even when the real Neshan
      # licence is not configured. A dummy resource is NEVER signed or published.
      - name: Compile native Neshan SDK adapter (no production licence)
        if: env.PEDALPRO_NESHAN_SDK == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          trap 'rm -f app/src/main/res/raw/neshan.licence' EXIT
          printf 'INVALID-CI-COMPILE-ONLY' > app/src/main/res/raw/neshan.licence
          gradle :app:compileBazaarReleaseJavaWithJavac \
            -PpedalproNeshanAndroidSdk=true --stacktrace

      - name: APK manifest smoke checks
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)"
          BAZAAR="$(find app/build/outputs/apk/bazaar/release -name '*.apk' | head -n1)"
          MYKET="$(find app/build/outputs/apk/myket/release -name '*.apk' | head -n1)"
          test -n "$BAZAAR"
          test -n "$MYKET"
          "$AAPT" dump badging "$BAZAAR" | tee /tmp/bazaar-badging.txt
          "$AAPT" dump badging "$MYKET" | tee /tmp/myket-badging.txt
          grep -q "package: name='ir.pedalpro.app'" /tmp/bazaar-badging.txt
          grep -q "versionCode='52'" /tmp/bazaar-badging.txt
          grep -q "versionName='2.0.0-native-rc8'" /tmp/bazaar-badging.txt
          grep -q "launchable-activity: name='ir.pedalpro.app.nativeapp.NativeMainActivity'" /tmp/bazaar-badging.txt
          grep -q "package: name='ir.pedalpro.app'" /tmp/myket-badging.txt
          grep -q "versionCode='52'" /tmp/myket-badging.txt
          grep -q "versionName='2.0.0-native-rc8'" /tmp/myket-badging.txt
          grep -q "launchable-activity: name='ir.pedalpro.app.nativeapp.NativeMainActivity'" /tmp/myket-badging.txt

      - name: Enforce lint success
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Android lint did not pass."
            exit 1
          fi
