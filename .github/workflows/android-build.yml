name: Android Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Development pushes run unsigned QA, not a signed store build for every commit.
# For RC delivery select "Run workflow" on native/web-parity to build signed APKs.
# Main-branch pushes retain automatic release build; no publishing is automatic.
# Rapid subsequent commits cancel stale push builds; manual builds remain protected.
concurrency:
  group: store-signed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NESHAN_MOBILE_API_KEY: ${{ secrets.NESHAN_MOBILE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Require genuine Neshan MOBILE key for signed release
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NESHAN_MOBILE_API_KEY:-}" ]; then
            echo "::error::NESHAN_MOBILE_API_KEY missing. Refusing to publish fallback-labelled signed artifacts."
            exit 1
          fi
          echo "Official Neshan MapLibre provider enabled for this signed build."

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEDALPRO_BAZAAR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pedalpro-release.jks

      - name: Check keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
          -v \
          -keystore app/pedalpro-release.jks \
          -storepass "$KEYSTORE_PASSWORD"

      - name: Build release APKs
        run: |
          gradle :app:assembleBazaarRelease :app:assembleMyketRelease \
            --stacktrace

      - name: Verify Neshan API-key metadata without revealing its value
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -1)"
          test -x "$AAPT"
          for apk in app/build/outputs/apk/bazaar/release/*.apk app/build/outputs/apk/myket/release/*.apk; do
            test -f "$apk"
            # Never display AndroidManifest: its compiled meta-data contains the MOBILE key.
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml | grep -Fq 'org.maplibre.android.API_KEY'
            if "$AAPT" dump xmltree "$apk" AndroidManifest.xml | grep -Fq 'UNCONFIGURED'; then
              echo "::error::Neshan AndroidManifest contains the no-key fallback placeholder."
              exit 1
            fi
          done
          echo "Both APK manifests declare the Neshan MOBILE key metadata."

      - name: Sign APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)

          mkdir -p app/build/outputs/signed

          for apk in app/build/outputs/apk/bazaar/release/*.apk app/build/outputs/apk/myket/release/*.apk
          do
            NAME=$(basename "$apk" .apk)

            ALIGNED="app/build/outputs/signed/${NAME}-aligned.apk"
            SIGNED="app/build/outputs/signed/${NAME}-signed.apk"

            "$BUILD_TOOLS" \
              -f \
              -p 4 \
              "$apk" \
              "$ALIGNED"

            "$APK_SIGNER" sign \
              --ks app/pedalpro-release.jks \
              --ks-type JKS \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$SIGNED" \
              "$ALIGNED"

            "$APK_SIGNER" verify \
              --verbose \
              "$SIGNED"

          done

      - name: Upload Bazaar signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-bazaar-signed-release
          path: app/build/outputs/signed/*bazaar*-signed.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 3 }}

      - name: Upload Myket signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-myket-signed-release
          path: app/build/outputs/signed/*myket*-signed.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 3 }}

      # No automatic Bazaar/Myket publish. Owner explicitly requires manual approval.
