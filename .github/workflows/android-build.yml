name: Android Store Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/android-1.4.2-neshan-lowpower

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEDALPRO_BAZAAR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pedalpro-release.jks
          test -s app/pedalpro-release.jks

      - name: Check keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          keytool -list -keystore app/pedalpro-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build release APKs
        shell: bash
        run: |
          gradle :app:assembleBazaarRelease :app:assembleMyketRelease --stacktrace

      - name: Sign APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        shell: bash
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          shopt -s nullglob
          APKS=(
            app/build/outputs/apk/bazaar/release/*.apk
            app/build/outputs/apk/myket/release/*.apk
          )
          test "${#APKS[@]}" -ge 2
          for apk in "${APKS[@]}"; do
            case "$apk" in
              *-aligned.apk|*-signed.apk) continue ;;
            esac
            ALIGNED="${apk%.apk}-aligned.apk"
            SIGNED="${apk%.apk}-signed.apk"
            "$ZIPALIGN" -f -p 4 "$apk" "$ALIGNED"
            "$APKSIGNER" sign               --ks app/pedalpro-release.jks               --ks-type JKS               --ks-key-alias "$KEY_ALIAS"               --ks-pass pass:"$KEYSTORE_PASSWORD"               --key-pass pass:"$KEY_PASSWORD"               --out "$SIGNED"               "$ALIGNED"
            "$APKSIGNER" verify --verbose "$SIGNED"
          done

      - name: Verify signed outputs
        shell: bash
        run: |
          test -n "$(find app/build/outputs/apk/bazaar/release -name '*-signed.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/myket/release -name '*-signed.apk' -print -quit)"

      - name: Upload Bazaar signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.4-bazaar-signed
          path: app/build/outputs/apk/bazaar/release/*-signed.apk
          if-no-files-found: error

      - name: Upload Myket signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.4-myket-signed
          path: app/build/outputs/apk/myket/release/*-signed.apk
          if-no-files-found: error
