name: Android Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, release/android-1.4.6 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Bazaar APK
        run: gradle :app:assembleBazaarRelease --stacktrace

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEDALPRO_BAZAAR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pedalpro-release.jks

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          APK=$(find app/build/outputs/apk/bazaar/release -name '*.apk' | head -1)
          mkdir -p app/build/outputs/signed
          ALIGNED=app/build/outputs/signed/PedalPro-1.4.6-aligned.apk
          SIGNED=app/build/outputs/signed/PedalPro-1.4.6-bazaar-signed.apk
          "$BUILD_TOOLS" -f -p 4 "$APK" "$ALIGNED"
          "$APK_SIGNER" sign --ks app/pedalpro-release.jks --ks-type JKS --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$APK_SIGNER" verify "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.6-bazaar-APK-signed
          path: app/build/outputs/signed/PedalPro-1.4.6-bazaar-signed.apk
          if-no-files-found: error
