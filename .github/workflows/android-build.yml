name: Android Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEDALPRO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pedalpro-release.jks
      - name: Build signed store release artifacts
        env:
          KEYSTORE_FILE: pedalpro-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PEDALPRO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PEDALPRO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PEDALPRO_KEY_PASSWORD }}
        run: gradle :app:assembleBazaarRelease :app:assembleMyketRelease --stacktrace
      - name: Upload Cafe Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-signed-bazaar-release
          path: app/build/outputs/apk/bazaar/release/*.apk
          if-no-files-found: error
      - name: Upload Myket APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-signed-myket-release
          path: app/build/outputs/apk/myket/release/*.apk
          if-no-files-found: error
