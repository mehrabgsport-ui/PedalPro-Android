name: Android Store Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, release/android-1.4.5 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure Bazaar signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEDALPRO_BAZAAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pedalpro-release.jks

      - name: Check Bazaar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore app/pedalpro-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build store release artifacts
        run: |
          gradle :app:assembleGooglePlayRelease :app:bundleGooglePlayRelease :app:assembleBazaarRelease --stacktrace

      - name: Sign Bazaar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BAZAAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZAAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAZAAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          SRC_APK=$(find app/build/outputs/apk/bazaar/release -maxdepth 1 -type f -name '*.apk' | head -n 1)

          test -n "$SRC_APK"
          mkdir -p app/build/outputs/signed

          ALIGNED="app/build/outputs/signed/PedalPro-1.4.5-bazaar-aligned.apk"
          SIGNED="app/build/outputs/signed/PedalPro-1.4.5-bazaar-signed.apk"

          "$ZIPALIGN" -f -p 4 "$SRC_APK" "$ALIGNED"

          "$APKSIGNER" sign             --ks app/pedalpro-release.jks             --ks-type JKS             --ks-key-alias "$KEY_ALIAS"             --ks-pass pass:"$KEYSTORE_PASSWORD"             --key-pass pass:"$KEY_PASSWORD"             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          rm -f "$ALIGNED"

      - name: Upload Bazaar signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.5-bazaar-APK-signed
          path: app/build/outputs/signed/PedalPro-1.4.5-bazaar-signed.apk
          if-no-files-found: error

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.5-googlePlay-AAB-unsigned
          path: app/build/outputs/bundle/googlePlayRelease/*.aab
          if-no-files-found: error

      - name: Upload Google Play APK smoke build
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-1.4.5-googlePlay-APK-unsigned
          path: app/build/outputs/apk/googlePlay/release/*.apk
          if-no-files-found: error
