name: PedalPro Native V2 Preview

on:
  workflow_dispatch:
  push:
    branches: [ main, native-v2-final ]

jobs:
  build-native:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Native Preview APK
        run: gradle :nativeapp:assembleDebug --stacktrace

      - name: Upload Native Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: PedalPro-Native-V2-Preview
          path: nativeapp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
